server {
    listen 80;
    server_name proxytest.renuoapp.ch; # Replace with your domain or IP

    location / {
        proxy_pass https://www.renuo.ch; # Replace with your backend service address

	proxy_ssl_server_name on;
	proxy_ssl_name www.renuo.ch; # Replace with your host

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
